name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:public
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: forms
          path: |
            forms.zip
            forms-server.zip
            opencloud-forms-*.zip
            SHA256SUMS
